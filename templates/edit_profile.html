{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="form-card card">
    <h2>Edit My Information</h2>
    <form method="POST" action="{{ url_for('edit_profile') }}">
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="0" max="120"
                   value="{{ profile.age if profile and profile.age is not none else '' }}">
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="">-- Select --</option>
                {% set current = profile.gender if profile else '' %}
                <option value="Male" {% if current == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if current == 'Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if current == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" name="phone"
                   value="{{ profile.phone if profile else '' }}">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3">{{ profile.address if profile else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="blood_group">Blood Group</label>
            <input type="text" id="blood_group" name="blood_group" placeholder="e.g. O+"
                   value="{{ profile.blood_group if profile else '' }}">
        </div>

        <div class="form-group">
            <label for="allergies">Allergies</label>
            <textarea id="allergies" name="allergies" rows="2">{{ profile.allergies if profile else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="medical_conditions">Existing Medical Conditions</label>
            <textarea id="medical_conditions" name="medical_conditions" rows="2">{{ profile.medical_conditions if profile else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
    </form>

    <p class="form-footer">
        <a href="{{ url_for('patient_dashboard') }}">&larr; Back to Dashboard</a>
    </p>
</div>
{% endblock %}
